<!DOCTYPE html>
<html>

<head>
    <title>RPG: Random Password Generator</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: RGB(247, 247, 250);
            flex-direction: column;
        }

        .generate-button {
            font-size: large;
            font-family: "IBM Plex Mono", monospace;
            float: left;
            margin: 10px;
            padding: 10px 20px;
            background-color: #000000;
            color: #fff;
            border: 1px solid #000000;
            border-radius: 25px;
            transition: all 0.3s ease;
        }

        .generate-button:hover {
            font-weight: bold;
            background-color: rgb(177, 238, 249);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            transform: scale(1.1);
            z-index: 1;
        }

        .password-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            flex-wrap: wrap;
        }

        .password-list {
            list-style: none;
            padding: 10px;
            margin: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .password-list li {
            font-family: "IBM Plex Mono", monospace;
            margin: 0;
            padding: 10px;
            background-color: #8ab3ad;
            border: none;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .password-list li:hover {
            font-weight: bold;
            background-color: rgb(177, 238, 249);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            transform: scale(1.1);
            z-index: 1;
        }
    </style>
</head>

<body>
    <form action="/" method="POST" style="display: flex; flex-direction: column; align-items: center;">
        <button class="generate-button" type="submit">Generate Your Password</button>
        <div style="margin-bottom: 10px; margin-top: 10px;">
            <label for="length"
                style="font-family: 'IBM Plex Mono', monospace; font-size: large; margin-right: 10px;">Length:</label>
            <input type="number" id="length" name="length" min="8" max="20" value="{{ length|default(16) }}"
                style="font-family: 'IBM Plex Mono', monospace; font-size: large; padding: 5px; border: 1px solid #000000; border-radius: 5px; width: 60px; text-align: center;">
        </div>
    </form>

    {% if password_groups %}
    <div class="password-container">
        {% for group in password_groups %}
        <ul class="password-list">
            {% for password in group.passwords %}
            {% if password %}
            <li>{{ password }}</li>
            {% endif %}
            {% endfor %}
        </ul>
        {% endfor %}
    </div>
    {% endif %}

    <footer style="margin-top: 40px; padding: 20px 0; text-align: center; width: 100%;">
        <a href="https://github.com/i0Ek3/rpg" target="_blank" rel="noopener noreferrer"
            style="font-family: 'IBM Plex Mono', monospace; text-decoration: none; color: #000; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px;">
            <svg width="20" height="20" viewBox="0 0 16 16" version="1.1" aria-hidden="true">
                <path fill-rule="evenodd"
                    d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z">
                </path>
            </svg>
            GitHub Project
        </a>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            let passwordItems = document.querySelectorAll('.password-list li');
            passwordItems.forEach(function (item) {
                item.addEventListener('click', function () {
                    let password = this.textContent;
                    copyToClipboard(password);
                });
            });

            function copyToClipboard(text) {
                let textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);

                showCopyMessage();
            }

            function showCopyMessage() {
                let message = document.createElement('div');
                message.textContent = 'Password Copied!';
                message.style.fontFamily = '"IBM Plex Mono",monospace';
                message.style.position = 'fixed';
                message.style.top = '10px';
                message.style.left = '50%';
                message.style.transform = 'translateX(-50%)';
                message.style.padding = '10px';
                message.style.background = '#8ab3ad';
                message.style.borderRadius = '4px';

                document.body.appendChild(message);

                setTimeout(function () {
                    document.body.removeChild(message);
                }, 2000);
            }
        });
    </script>
</body>

</html>
