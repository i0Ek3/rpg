<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>RPG Popup</title>
    <link rel="stylesheet" href="css/popup.css">
</head>

<body>
    <div class="header">
        <h1>Random Password Generator</h1>
        <div class="controls">
            <button id="generate-btn" class="generate-button">Generate</button>
            <label for="length">Length:</label>
            <input type="number" id="length" name="length" min="8" max="20" value="16">
        </div>
    </div>

    <div id="password-container" class="password-container">
        <!-- Passwords will be injected here -->
    </div>

    <script src="js/generator.js"></script>
    <script src="js/popup.js"></script>
</body>

</html>
